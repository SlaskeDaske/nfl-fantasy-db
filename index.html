<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Fantasy DB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:       #08101A;
  --surf:     #0F1B27;
  --surf-2:   #172434;
  --border:   #1A2B3C;
  --border-2: #243A50;

  --text:   #DDE6EF;
  --text-2: #7E9BB5;
  --text-3: #3D5670;

  --orange: #F97316;
  --orange-dim: rgba(249,115,22,0.1);

  --qb:  #E05252;
  --rb:  #3B82F6;
  --wr:  #22C55E;
  --te:  #F59E0B;
  --k:   #A78BFA;
  --def: #64748B;

  --tag-g-bg:   #0E3321; --tag-g-tx: #4ADE80;
  --tag-r-bg:   #3B0A0A; --tag-r-tx: #F87171;
  --tag-b-bg:   #0D2545; --tag-b-tx: #60A5FA;
  --tag-n-bg:   #111F2C; --tag-n-tx: #7E9BB5;

  --radius: 10px;
  --font: 'Inter', system-ui, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ─── HEADER ─────────────────────────────────────── */
.header-outer {
  padding: 24px 20px 0;
  max-width: 1440px;
  margin: 0 auto;
}

.header-row {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 18px;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 38px;
  letter-spacing: 0.04em;
  line-height: 1;
  color: var(--text);
  flex-shrink: 0;
}

.logo span { color: var(--orange); }

.tagline {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding-bottom: 4px;
}

.count-badge {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-3);
  white-space: nowrap;
  padding-bottom: 4px;
}

/* ─── SEARCH ──────────────────────────────────────── */
.search-wrap {
  position: relative;
  margin-bottom: 4px;
}

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-3);
  pointer-events: none;
}

.search-input {
  width: 100%;
  padding: 12px 16px 12px 44px;
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  outline: none;
  transition: border-color .18s;
}

.search-input::placeholder { color: var(--text-3); }
.search-input:focus { border-color: var(--orange); }

/* ─── STICKY CONTROLS ────────────────────────────── */
.controls-outer {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

.controls-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* position pills */
.pos-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.pos-btn {
  padding: 5px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-2);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: all .15s;
}

.pos-btn:hover { border-color: var(--border-2); color: var(--text); }

.pos-btn.active                 { color:#fff; border-color:transparent; }
.pos-btn.active[data-pos="ALL"] { background: var(--orange); }
.pos-btn.active[data-pos="QB"]  { background: var(--qb); }
.pos-btn.active[data-pos="RB"]  { background: var(--rb); }
.pos-btn.active[data-pos="WR"]  { background: var(--wr); }
.pos-btn.active[data-pos="TE"]  { background: var(--te); }
.pos-btn.active[data-pos="K"]   { background: var(--k); }
.pos-btn.active[data-pos="DEF"] { background: var(--def); }

.filter-count {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-3);
}

/* toggle row */
.toggle-row {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.toggle-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text-2);
  cursor: pointer;
  user-select: none;
}

.toggle-label input[type="checkbox"] {
  width: 14px; height: 14px;
  accent-color: var(--orange);
  cursor: pointer;
}

/* sort */
.sort-select {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-2);
  font-family: var(--font);
  font-size: 12px;
  padding: 3px 8px;
  cursor: pointer;
  outline: none;
}

/* ─── MAIN ────────────────────────────────────────── */
main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 20px;
}

/* ─── GRID ────────────────────────────────────────── */
.player-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 10px;
}

/* ─── CARD ────────────────────────────────────────── */
.player-card {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  transition: border-color .18s, transform .15s;
  cursor: default;
}

.player-card:hover {
  border-color: var(--border-2);
  transform: translateY(-1px);
}

/* card top */
.card-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.pos-badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 4px 8px;
  border-radius: 5px;
  flex-shrink: 0;
  color: #fff;
}

.pos-badge.QB  { background: var(--qb); }
.pos-badge.RB  { background: var(--rb); }
.pos-badge.WR  { background: var(--wr); }
.pos-badge.TE  { background: var(--te); }
.pos-badge.K   { background: var(--k); }
.pos-badge.DEF { background: var(--def); }

.card-name-block { flex: 1; min-width: 0; }

.player-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.player-sub {
  font-size: 12px;
  color: var(--text-2);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.team-abbr { color: var(--orange); font-weight: 600; }

/* depth row */
.depth-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.depth-key {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

.depth-val {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
}

.depth-val.d1 { color: #4ADE80; }
.depth-val.d2 { color: #60A5FA; }

/* meta row */
.meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.meta-item {
  font-size: 12px;
  color: var(--text-3);
}

.meta-item strong {
  color: var(--text-2);
  font-weight: 500;
}

/* tags */
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 2px;
}

.tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.07em;
  padding: 2px 7px;
  border-radius: 4px;
  text-transform: uppercase;
}

.tag.pos  { background: var(--tag-g-bg); color: var(--tag-g-tx); }
.tag.neg  { background: var(--tag-r-bg); color: var(--tag-r-tx); }
.tag.info { background: var(--tag-b-bg); color: var(--tag-b-tx); }
.tag.neu  { background: var(--tag-n-bg); color: var(--tag-n-tx); }

/* ─── LOADING ─────────────────────────────────────── */
.loading {
  padding: 80px 20px;
  text-align: center;
  color: var(--text-2);
}

.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--orange);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-sub {
  font-size: 13px;
  color: var(--text-3);
  margin-top: 6px;
}

/* ─── EMPTY STATE ─────────────────────────────────── */
.empty {
  padding: 80px 20px;
  text-align: center;
}

.empty h3 { font-size: 17px; color: var(--text-2); margin-bottom: 8px; }
.empty p  { font-size: 14px; color: var(--text-3); }

/* ─── LOAD MORE ───────────────────────────────────── */
.load-more-wrap {
  text-align: center;
  padding: 28px 0 8px;
}

.load-more-btn {
  padding: 10px 32px;
  background: transparent;
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  color: var(--text-2);
  font-family: var(--font);
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
}

.load-more-btn:hover { border-color: var(--orange); color: var(--text); }

/* ─── MOBILE ──────────────────────────────────────── */
@media (max-width: 600px) {
  .logo { font-size: 28px; }
  .tagline { display: none; }
  .player-grid { grid-template-columns: 1fr; }
  .filter-count { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
  .player-card { transition: none; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header-outer">
  <div class="header-row">
    <div class="logo">NFL <span>Fantasy</span> DB</div>
    <div class="tagline">Spillerprofiler · Tags · Scheme</div>
    <div class="count-badge" id="count-badge">Henter...</div>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input class="search-input" type="text" id="search"
           placeholder="Søg på navn, hold, college…" autocomplete="off" spellcheck="false">
  </div>
</div>

<!-- STICKY CONTROLS -->
<div class="controls-outer">
  <div class="controls-inner">
    <div class="pos-row">
      <button class="pos-btn active" data-pos="ALL">Alle</button>
      <button class="pos-btn" data-pos="QB">QB</button>
      <button class="pos-btn" data-pos="RB">RB</button>
      <button class="pos-btn" data-pos="WR">WR</button>
      <button class="pos-btn" data-pos="TE">TE</button>
      <button class="pos-btn" data-pos="K">K</button>
      <button class="pos-btn" data-pos="DEF">DEF</button>
      <span class="filter-count" id="filter-count"></span>
    </div>
    <div class="toggle-row">
      <label class="toggle-label">
        <input type="checkbox" id="starters-only"> Kun startere
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="hide-ir" checked> Skjul IR/Out
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="hide-fa"> Skjul free agents
      </label>
      <select class="sort-select" id="sort-by">
        <option value="rank">Sorter: Rank</option>
        <option value="name">Sorter: Navn</option>
        <option value="age">Sorter: Alder</option>
        <option value="exp">Sorter: Erfaring</option>
      </select>
    </div>
  </div>
</div>

<!-- MAIN CONTENT -->
<main>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>Henter NFL-spillere fra Sleeper API…</div>
    <div class="loading-sub">Første gang kan tage et par sekunder (5 MB data)</div>
  </div>

  <div id="player-grid" class="player-grid" style="display:none"></div>

  <div id="empty" class="empty" style="display:none">
    <h3>Ingen spillere fundet</h3>
    <p>Prøv et andet navn, hold eller juster filtrene.</p>
  </div>

  <div id="load-more-wrap" class="load-more-wrap" style="display:none">
    <button class="load-more-btn" id="load-more-btn">Vis flere spillere</button>
  </div>
</main>

<script>
'use strict';

// ── Config ──────────────────────────────────────────────────────────────────
const POSITIONS   = ['QB','RB','WR','TE','K','DEF'];
const PAGE_SIZE   = 60;
const CACHE_KEY   = 'nfl_players_v2';
const CACHE_EXP   = 'nfl_players_exp_v2';
const CACHE_HOURS = 6;

// ── State ────────────────────────────────────────────────────────────────────
let allPlayers   = [];
let filtered     = [];
let displayCount = PAGE_SIZE;
let activePos    = 'ALL';
let startersOnly = false;
let hideIR       = true;
let hideFA       = false;
let sortBy       = 'rank';

// ── Boot ─────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const raw = await loadPlayers();
    allPlayers = processPlayers(raw);
    document.getElementById('count-badge').textContent =
      `${allPlayers.length.toLocaleString('da')} spillere`;
    applyFilters();
  } catch (err) {
    document.getElementById('loading').innerHTML =
      `<p style="color:var(--tag-r-tx)">Kunne ikke hente data. Tjek din forbindelse og prøv igen.</p>`;
    console.error(err);
  }
}

// ── Data fetch ───────────────────────────────────────────────────────────────
async function loadPlayers() {
  try {
    const exp = localStorage.getItem(CACHE_EXP);
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached && exp && Date.now() < parseInt(exp, 10)) {
      return JSON.parse(cached);
    }
  } catch (_) {}

  const res  = await fetch('https://api.sleeper.app/v1/players/nfl');
  const data = await res.json();

  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    localStorage.setItem(CACHE_EXP, (Date.now() + CACHE_HOURS * 3600_000).toString());
  } catch (_) {
    // Storage quota exceeded – carry on without caching
  }

  return data;
}

// ── Process raw Sleeper data ──────────────────────────────────────────────────
function processPlayers(raw) {
  return Object.values(raw)
    .filter(p => {
      if (!p.full_name || !p.position) return false;
      if (!POSITIONS.includes(p.position)) return false;
      if (p.active === false) return false;
      // Keep players on a team, or notable free agents
      if (!p.team && (!p.search_rank || p.search_rank > 300)) return false;
      return true;
    })
    .map(p => ({ ...p, tags: buildTags(p) }))
    .sort(compareFn('rank'));
}

// ── Tag generation ────────────────────────────────────────────────────────────
function buildTags(p) {
  const t   = [];
  const yr  = p.years_exp;
  const dc  = p.depth_chart_order;
  const inj = p.injury_status;
  const sr  = p.search_rank;

  // Rank tier
  if (sr && sr <= 12)  t.push({ l:'ELITE', c:'pos' });
  else if (sr && sr <= 50)  t.push({ l:'TOP 50', c:'pos' });
  else if (sr && sr <= 100) t.push({ l:'TOP 100', c:'pos' });

  // Depth chart
  if (dc === 1)                        t.push({ l:'STARTER', c:'pos' });
  else if (dc === 2 && p.position==='RB') t.push({ l:'HANDCUFF', c:'neu' });
  else if (dc === 2)                   t.push({ l:'BACKUP', c:'neu' });
  else if (dc >= 3)                    t.push({ l:'DEPTH', c:'neu' });

  // Experience
  if (yr === 0) t.push({ l:'ROOKIE', c:'info' });
  else if (yr >= 12) t.push({ l:'LEGEND', c:'info' });
  else if (yr >= 8)  t.push({ l:'VETERAN', c:'info' });

  // Team status
  if (!p.team) t.push({ l:'FREE AGENT', c:'neu' });

  // Injury
  const injMap = { IR:'IR', Out:'OUT', Doubtful:'DOUBTFUL',
                   Questionable:'QUESTIONABLE', PUP:'PUP', NFI:'NFI' };
  if (inj && injMap[inj]) t.push({ l:injMap[inj], c:'neg' });

  return t;
}

// ── Sorting ───────────────────────────────────────────────────────────────────
function compareFn(key) {
  return (a, b) => {
    switch (key) {
      case 'name': return (a.full_name||'').localeCompare(b.full_name||'', 'da');
      case 'age':  return (a.age||99) - (b.age||99);
      case 'exp':  return (b.years_exp||0) - (a.years_exp||0);
      default:     return (a.search_rank||9999) - (b.search_rank||9999);
    }
  };
}

// ── Filter + render ───────────────────────────────────────────────────────────
function applyFilters() {
  const q = document.getElementById('search').value.trim().toLowerCase();

  filtered = allPlayers
    .filter(p => {
      if (activePos !== 'ALL' && p.position !== activePos) return false;
      if (startersOnly && p.depth_chart_order !== 1)       return false;
      if (hideIR && (p.injury_status === 'IR' || p.injury_status === 'Out')) return false;
      if (hideFA && !p.team)                               return false;
      if (q) {
        const hay = [p.full_name, p.team, p.college, p.depth_chart_position]
          .filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    })
    .sort(compareFn(sortBy));

  displayCount = PAGE_SIZE;
  render();
}

// ── DOM rendering ─────────────────────────────────────────────────────────────
function render() {
  const grid   = document.getElementById('player-grid');
  const empty  = document.getElementById('empty');
  const lmWrap = document.getElementById('load-more-wrap');
  document.getElementById('loading').style.display = 'none';
  document.getElementById('filter-count').textContent =
    `${filtered.length.toLocaleString('da')} spillere`;

  if (!filtered.length) {
    grid.style.display   = 'none';
    empty.style.display  = 'block';
    lmWrap.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  grid.style.display  = 'grid';
  grid.innerHTML = filtered.slice(0, displayCount).map(cardHTML).join('');
  lmWrap.style.display = displayCount < filtered.length ? 'block' : 'none';
}

// ── Card HTML ─────────────────────────────────────────────────────────────────
function cardHTML(p) {
  const pos = p.position || '–';
  const dc  = p.depth_chart_order;
  const dcClass = dc === 1 ? 'd1' : dc === 2 ? 'd2' : '';
  const dcPos   = p.depth_chart_position || pos;
  const dcLabel = dc ? `${dcPos}${dc}` : '';

  const teamStr = p.team
    ? `<span class="team-abbr">${p.team}</span>${p.number ? ` #${p.number}` : ''}`
    : `<span style="color:var(--text-3)">Free Agent</span>`;

  const college = p.college
    ? ` · <span title="College">${p.college}</span>` : '';

  const agePart = p.age
    ? `<span class="meta-item"><strong>${p.age}</strong> år</span>` : '';
  const expPart = p.years_exp !== undefined
    ? `<span class="meta-item"><strong>${p.years_exp}</strong> sæs.</span>` : '';
  const htPart  = p.height
    ? `<span class="meta-item">${p.height}${p.weight ? ' / ' + p.weight + ' lbs' : ''}</span>` : '';

  const tagsHTML = (p.tags || [])
    .map(t => `<span class="tag ${t.c}">${t.l}</span>`)
    .join('');

  return `
<div class="player-card">
  <div class="card-top">
    <span class="pos-badge ${pos}">${pos}</span>
    <div class="card-name-block">
      <div class="player-name">${esc(p.full_name)}</div>
      <div class="player-sub">${teamStr}${college}</div>
    </div>
  </div>
  ${dcLabel ? `<div class="depth-row">
    <span class="depth-key">Depth</span>
    <span class="depth-val ${dcClass}">${dcLabel}</span>
  </div>` : ''}
  <div class="meta-row">${agePart}${expPart}${htPart}</div>
  ${tagsHTML ? `<div class="tags">${tagsHTML}</div>` : ''}
</div>`;
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Event wiring ──────────────────────────────────────────────────────────────
document.getElementById('search')
  .addEventListener('input', applyFilters);

document.querySelectorAll('.pos-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activePos = btn.dataset.pos;
    document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  });
});

document.getElementById('starters-only').addEventListener('change', e => {
  startersOnly = e.target.checked; applyFilters();
});
document.getElementById('hide-ir').addEventListener('change', e => {
  hideIR = e.target.checked; applyFilters();
});
document.getElementById('hide-fa').addEventListener('change', e => {
  hideFA = e.target.checked; applyFilters();
});
document.getElementById('sort-by').addEventListener('change', e => {
  sortBy = e.target.value; applyFilters();
});
document.getElementById('load-more-btn').addEventListener('click', () => {
  displayCount += PAGE_SIZE;
  render();
});

// ── Go ────────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
