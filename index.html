<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Fantasy DB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08101A;--surf:#0F1B27;--surf-2:#172434;--surf-3:#1E2F42;
  --border:#1A2B3C;--bord-2:#243A50;
  --text:#DDE6EF;--text-2:#7E9BB5;--text-3:#3D5670;
  --orange:#F97316;
  --qb:#E05252;--rb:#3B82F6;--wr:#22C55E;--te:#F59E0B;--k:#A78BFA;--def:#64748B;
  --tg-bg:#0E3321;--tg-tx:#4ADE80;
  --tr-bg:#3B0A0A;--tr-tx:#F87171;
  --tb-bg:#0D2545;--tb-tx:#60A5FA;
  --tn-bg:#111F2C;--tn-tx:#7E9BB5;
  --radius:10px;--font:'Inter',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh}

/* HEADER */
.hdr{padding:24px 20px 0;max-width:1440px;margin:0 auto}
.hdr-row{display:flex;align-items:baseline;gap:16px;margin-bottom:18px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:.04em;line-height:1;flex-shrink:0}
.logo span{color:var(--orange)}
.tagline{font-size:12px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;padding-bottom:4px}
.cnt{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap;padding-bottom:4px}
.search-wrap{position:relative;margin-bottom:4px}
.search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search-input{width:100%;padding:12px 16px 12px 44px;background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font);font-size:15px;outline:none;transition:border-color .18s}
.search-input::placeholder{color:var(--text-3)}
.search-input:focus{border-color:var(--orange)}

/* CONTROLS */
.ctrl-outer{position:sticky;top:0;z-index:20;background:var(--bg)}
.ctrl-inner{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border)}
.pos-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pos-btn{padding:5px 14px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-family:var(--font);font-size:12px;font-weight:600;letter-spacing:.05em;cursor:pointer;transition:all .15s}
.pos-btn:hover{border-color:var(--bord-2);color:var(--text)}
.pos-btn.active{color:#fff;border-color:transparent}
.pos-btn.active[data-pos="ALL"]{background:var(--orange)}
.pos-btn.active[data-pos="QB"]{background:var(--qb)}
.pos-btn.active[data-pos="RB"]{background:var(--rb)}
.pos-btn.active[data-pos="WR"]{background:var(--wr)}
.pos-btn.active[data-pos="TE"]{background:var(--te)}
.pos-btn.active[data-pos="K"] {background:var(--k)}
.pos-btn.active[data-pos="DEF"]{background:var(--def)}
.flt-cnt{margin-left:auto;font-size:12px;color:var(--text-3)}
.tog-row{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.tog-lbl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);cursor:pointer;user-select:none}
.tog-lbl input[type=checkbox]{width:14px;height:14px;accent-color:var(--orange);cursor:pointer}
.sort-sel{background:var(--surf);border:1px solid var(--border);border-radius:6px;color:var(--text-2);font-family:var(--font);font-size:12px;padding:3px 8px;cursor:pointer;outline:none}

.team-btn{padding:5px 14px;border-radius:999px;border:1px solid var(--orange);background:transparent;color:var(--orange);font-family:var(--font);font-size:12px;font-weight:600;letter-spacing:.05em;cursor:pointer;transition:all .15s;flex-shrink:0}
.team-btn:hover,.team-btn.active{background:var(--orange);color:#fff}

/* TAG FILTER - wrap after top 20 */
.tf-outer{overflow:hidden;border-bottom:1px solid var(--border)}
.tf-row{max-width:1440px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tf-lbl{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;flex-shrink:0;margin-right:2px}
#tf-pills{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tf-pill{font-size:10px;font-weight:700;letter-spacing:.07em;padding:3px 9px;border-radius:4px;text-transform:uppercase;cursor:pointer;border:1.5px solid transparent;display:inline-flex;align-items:center;gap:4px;transition:all .12s;flex-shrink:0}
.tf-pill:hover{filter:brightness(1.2)}
.tf-pill.pos{background:var(--tg-bg);color:var(--tg-tx);border-color:var(--tg-bg)}
.tf-pill.neg{background:var(--tr-bg);color:var(--tr-tx);border-color:var(--tr-bg)}
.tf-pill.info{background:var(--tb-bg);color:var(--tb-tx);border-color:var(--tb-bg)}
.tf-pill.neu{background:var(--tn-bg);color:var(--tn-tx);border-color:var(--tn-bg)}
.tf-pill.on.pos{border-color:var(--tg-tx)}.tf-pill.on.neg{border-color:var(--tr-tx)}
.tf-pill.on.info{border-color:var(--tb-tx)}.tf-pill.on.neu{border-color:var(--tn-tx)}
.tf-n{font-size:9px;opacity:.65;font-weight:600}
.tf-reset{font-size:11px;color:var(--text-3);background:transparent;border:1px solid var(--border);border-radius:4px;padding:3px 10px;cursor:pointer;flex-shrink:0;transition:all .12s;margin-left:4px}
.tf-reset:hover{color:var(--text);border-color:var(--bord-2)}

/* MAIN */
main{max-width:1440px;margin:0 auto;padding:20px}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}

/* HEADSHOTS */
.hs-wrap{position:relative;flex-shrink:0}
.hs-inner{width:50px;height:50px;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 0 0 2px var(--c,#64748B)}
.hs-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#fff;background:var(--c,#64748B);letter-spacing:.02em}
.hs-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.hs-badge{position:absolute;bottom:-3px;right:-7px;font-size:9px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:3px;color:#fff;background:var(--c,#64748B);line-height:1.6;z-index:1}

/* CARDS */
.player-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:9px;transition:border-color .18s,transform .15s;cursor:pointer}
.player-card:hover{border-color:var(--bord-2);transform:translateY(-1px)}
.card-top{display:flex;align-items:center;gap:12px}
.card-info{flex:1;min-width:0}
.player-name{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-sub{font-size:12px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-abbr{color:var(--orange);font-weight:600}
.depth-row{display:flex;align-items:center;gap:8px}
.depth-key{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em}
.depth-val{font-size:13px;font-weight:600;color:var(--text-2)}
.depth-val.d1{color:#4ADE80}.depth-val.d2{color:#60A5FA}
.meta-row{display:flex;flex-wrap:wrap;gap:12px}
.meta-item{font-size:12px;color:var(--text-3)}
.meta-item strong{color:var(--text-2);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tag{font-size:10px;font-weight:700;letter-spacing:.07em;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.tag.pos{background:var(--tg-bg);color:var(--tg-tx)}
.tag.neg{background:var(--tr-bg);color:var(--tr-tx)}
.tag.info{background:var(--tb-bg);color:var(--tb-tx)}
.tag.neu{background:var(--tn-bg);color:var(--tn-tx)}

/* MADDEN CARD BADGE */
.card-ovr{font-size:11px;font-weight:700;color:#fff;background:var(--c,#64748B);border-radius:4px;padding:2px 6px;flex-shrink:0;margin-left:auto;opacity:.9}

/* LOADING / EMPTY */
.loading{padding:80px 20px;text-align:center;color:var(--text-2)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-sub{font-size:13px;color:var(--text-3);margin-top:6px}
.empty{padding:80px 20px;text-align:center}
.empty h3{font-size:17px;color:var(--text-2);margin-bottom:8px}
.empty p{font-size:14px;color:var(--text-3)}
.lm-wrap{text-align:center;padding:28px 0 8px}
.lm-btn{padding:10px 32px;background:transparent;border:1px solid var(--bord-2);border-radius:var(--radius);color:var(--text-2);font-family:var(--font);font-size:13px;cursor:pointer;transition:all .15s}
.lm-btn:hover{border-color:var(--orange);color:var(--text)}

/* DETAIL PANEL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;backdrop-filter:blur(2px)}
.overlay.open{display:block}
.detail-panel{position:fixed;right:-420px;top:0;width:400px;height:100vh;background:var(--surf);border-left:1px solid var(--border);z-index:91;overflow-y:auto;transition:right .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.detail-panel.open{right:0}
.dp-close{position:sticky;top:0;z-index:1;background:var(--surf);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.dp-close-btn{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-2);font-family:var(--font);font-size:12px;padding:5px 12px;cursor:pointer;transition:all .15s}
.dp-close-btn:hover{border-color:var(--bord-2);color:var(--text)}
.dp-close-title{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em}
.dp-body{padding:20px;display:flex;flex-direction:column;gap:20px;flex:1}

/* Detail photo */
.dp-photo-outer{position:relative;flex-shrink:0}
.dp-photo-ring{width:76px;height:76px;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 0 0 2.5px var(--c,#64748B)}
.dp-photo-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:#fff;background:var(--c,#64748B)}
.dp-photo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}

/* Detail sections */
.dp-hero{display:flex;align-items:flex-start;gap:16px}
.dp-name{font-size:22px;font-weight:600;line-height:1.15;color:var(--text)}
.dp-team-line{font-size:14px;color:var(--text-2);margin-top:4px}
.dp-section{border-top:1px solid var(--border);padding-top:16px}
.dp-sec-title{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px}
.dp-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dp-stat{display:flex;flex-direction:column;gap:2px}
.dp-stat-val{font-size:16px;font-weight:600;color:var(--text)}
.dp-stat-key{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.dp-tags{display:flex;flex-direction:column;gap:8px}
.dp-tag-row{display:flex;align-items:flex-start;gap:10px}
.dp-tag-chip{font-size:10px;font-weight:700;letter-spacing:.07em;padding:3px 8px;border-radius:4px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;margin-top:1px}
.dp-tag-chip.pos{background:var(--tg-bg);color:var(--tg-tx)}
.dp-tag-chip.neg{background:var(--tr-bg);color:var(--tr-tx)}
.dp-tag-chip.info{background:var(--tb-bg);color:var(--tb-tx)}
.dp-tag-chip.neu{background:var(--tn-bg);color:var(--tn-tx)}
.dp-tag-desc{font-size:13px;color:var(--text-2);line-height:1.4}

/* Injury section */
.dp-injury{border-color:rgba(248,113,113,.2);background:rgba(59,10,10,.25);border-radius:8px;padding:12px 14px;border:1px solid rgba(248,113,113,.12)}
.dp-injury .dp-sec-title{border:none;margin-bottom:8px}
.dp-inj-row{display:flex;gap:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.dp-inj-row:last-child{border-bottom:none}
.dp-inj-key{color:var(--text-3);width:80px;flex-shrink:0;text-transform:capitalize}
.dp-inj-val{color:var(--text-2);flex:1}

/* Madden ratings in panel */
.dp-madden-header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.dp-ovr-badge{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.15)}
.dp-ovr-info{flex:1}
.dp-ovr-label{font-size:16px;font-weight:600;color:var(--text)}
.dp-ovr-src{font-size:11px;color:var(--text-3);margin-top:2px}
.mr-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mr-lbl{font-size:11px;color:var(--text-3);width:110px;flex-shrink:0}
.mr-bar-bg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.mr-bar{height:100%;border-radius:3px;transition:width .4s ease}
.mr-val{font-size:12px;font-weight:600;width:26px;text-align:right;flex-shrink:0}

/* Placeholder */
.dp-placeholder{background:var(--surf-2);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.dp-ph-label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

/* VIEW TOGGLE */
.view-toggle{display:flex;gap:4px;margin-left:8px;flex-shrink:0}
.view-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;color:var(--text-3);transition:all .15s}
.view-btn.active{background:var(--surf-2);border-color:var(--bord-2);color:var(--text)}
.view-btn:hover{border-color:var(--bord-2);color:var(--text)}

/* LIST VIEW */
.player-list{display:flex;flex-direction:column;gap:2px}
.player-row{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:9px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .15s}
.player-row:hover{border-color:var(--bord-2)}
.pr-hs{position:relative;flex-shrink:0}
.pr-hs-inner{width:36px;height:36px;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 0 0 2px var(--c,#64748B)}
.pr-hs-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;background:var(--c,#64748B)}
.pr-hs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.pr-pos{font-size:9px;font-weight:700;letter-spacing:.05em;padding:2px 5px;border-radius:3px;color:#fff;flex-shrink:0}
.pr-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pr-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-sub{font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-tags{display:flex;flex-wrap:wrap;gap:4px}
.pr-ovr{font-size:15px;font-weight:700;width:36px;text-align:center;flex-shrink:0}
.pr-depth{font-size:12px;font-weight:600;color:var(--text-2);width:46px;flex-shrink:0}
.pr-depth.d1{color:#4ADE80}.pr-depth.d2{color:#60A5FA}
.pr-meta{font-size:11px;color:var(--text-3);white-space:nowrap;flex-shrink:0;width:70px}
@media(max-width:680px){.pr-meta{display:none}.pr-depth{display:none}}

/* TEAM GRID */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.team-tile{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:0;text-align:center;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.team-tile:hover{border-color:var(--bord-2);transform:translateY(-2px)}
.t-color-bar{width:100%;height:4px;background:var(--tc,#64748B);flex-shrink:0}
.t-tile-body{padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.t-abbr{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.04em;line-height:1;color:var(--text)}
.t-name{font-size:9px;color:var(--text-3);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}
.t-meta{font-size:10px;color:var(--text-2)}

/* TEAM DETAIL */
.team-detail{display:block}
.team-detail-hdr{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.back-btn{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-2);font-family:var(--font);font-size:12px;padding:6px 12px;cursor:pointer;transition:all .15s;flex-shrink:0}
.back-btn:hover{border-color:var(--bord-2);color:var(--text)}
.t-name-big{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.04em;line-height:1}
.t-name-full{font-size:13px;color:var(--text-2);margin-left:2px}

/* SYNERGY CARDS */
.synergy-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.syn-card{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:14px}
.syn-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.syn-val{font-size:18px;font-weight:700;color:var(--text);line-height:1}
.syn-sub{font-size:11px;color:var(--text-3);margin-top:4px}
.syn-locked .syn-val{color:var(--bord-2)}
.syn-locked .syn-sub{color:var(--border)}
.syn-bar-bg{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.syn-bar{height:100%;border-radius:2px;background:var(--orange)}

/* POSITION GROUP */
.pos-group{margin-bottom:22px}
.pos-group-hdr{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pos-group-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;color:#fff}
.pos-group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}

@media(max-width:680px){.synergy-row{grid-template-columns:1fr 1fr}.team-grid{grid-template-columns:repeat(4,1fr)}}

/* NFLverse stats grid */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:4px}
.stat-cell{background:var(--surf-2);border-radius:6px;padding:8px 10px}
.stat-val{font-size:15px;font-weight:600;color:var(--text)}
.stat-key{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.stat-cell.highlight .stat-val{color:var(--tg-tx)}

/* MOBILE */
@media(max-width:680px){
  .logo{font-size:28px}.tagline{display:none}
  .player-grid{grid-template-columns:1fr}.flt-cnt{display:none}
  .detail-panel{right:auto;left:0;bottom:-100%;top:auto;width:100%;height:80vh;border-left:none;border-top:1px solid var(--border);transition:bottom .28s cubic-bezier(.4,0,.2,1)}
  .detail-panel.open{bottom:0;right:auto}
}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}.player-card,.detail-panel{transition:none}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <div class="logo">NFL <span>Fantasy</span> DB</div>
    <div class="tagline">Spillerprofiler · Tags · Madden 27</div>
    <div class="cnt" id="cnt">Henter…</div>
  </div>
  <div class="search-wrap">
    <svg class="search-ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input class="search-input" id="search" type="text" autocomplete="off" spellcheck="false" placeholder="Søg på navn, hold, college…">
  </div>
</div>

<div class="ctrl-outer">
  <div class="ctrl-inner">
    <div class="pos-row">
      <button class="pos-btn active" data-pos="ALL">Alle</button>
      <button class="pos-btn" data-pos="QB">QB</button>

  'DURABLE':'Madden injury rating ≥ 92 – historisk lav skadeprocent, konsekvent tilgængelig',
};

/* ── Team data ──────────────────────────────────────────── */
const TEAM_COLORS = {
  ARI:'#97233F',ATL:'#A71930',BAL:'#241773',BUF:'#00338D',CAR:'#0085CA',
  CHI:'#0B162A',CIN:'#FB4F14',CLE:'#311D00',DAL:'#003594',DEN:'#FB4F14',
  DET:'#0076B6',GB:'#203731',HOU:'#03202F',IND:'#002C5F',JAX:'#006778',
  KC:'#E31837',LV:'#000000',LAC:'#0080C6',LA:'#003594',MIA:'#008E97',
  MIN:'#4F2683',NE:'#002244',NO:'#9F8958',NYG:'#0B2265',NYJ:'#125740',
  PHI:'#004C54',PIT:'#FFB612',SF:'#AA0000',SEA:'#002244',TB:'#D50A0A',
  TEN:'#0C2340',WAS:'#5A1414',
};
const TEAM_NAMES = {
  ARI:'Arizona Cardinals',ATL:'Atlanta Falcons',BAL:'Baltimore Ravens',
  BUF:'Buffalo Bills',CAR:'Carolina Panthers',CHI:'Chicago Bears',
  CIN:'Cincinnati Bengals',CLE:'Cleveland Browns',DAL:'Dallas Cowboys',
  DEN:'Denver Broncos',DET:'Detroit Lions',GB:'Green Bay Packers',
  HOU:'Houston Texans',IND:'Indianapolis Colts',JAX:'Jacksonville Jaguars',
  KC:'Kansas City Chiefs',LV:'Las Vegas Raiders',LAC:'Los Angeles Chargers',
  LA:'Los Angeles Rams',MIA:'Miami Dolphins',MIN:'Minnesota Vikings',
  NE:'New England Patriots',NO:'New Orleans Saints',NYG:'New York Giants',
  NYJ:'New York Jets',PHI:'Philadelphia Eagles',PIT:'Pittsburgh Steelers',
  SF:'San Francisco 49ers',SEA:'Seattle Seahawks',TB:'Tampa Bay Buccaneers',
  TEN:'Tennessee Titans',WAS:'Washington Commanders',
};
const POS_ORDER_TEAM = ['QB','RB','WR','TE','K'];

/* ── State ──────────────────────────────────────────────── */
let allPlayers=[], filtered=[], displayCount=PAGE_SIZE;
let activePos='ALL', sortBy='rank';
let togStarters=false, togIR=true, togFA=false;
let activeTags=new Set();
let maddenData={};
let nflverseData={players:{},teams:{}};
let listView=false;
let teamView=null; // null | 'teams' | 'KC' etc.

/* ── Boot ───────────────────────────────────────────────── */
async function init() {
  try {
    const [sleeperRaw, maddenRaw, nflRaw] = await Promise.all([
      loadSleeper(),
      loadMadden(),
      loadNflverse(),
    ]);
    maddenData    = maddenRaw;
    nflverseData  = nflRaw;
    const mCount  = Object.keys(maddenData).length;
    const nCount  = Object.keys(nflRaw.players||{}).length;
    allPlayers = processPlayers(sleeperRaw);
    document.getElementById('cnt').textContent =
      `${allPlayers.length.toLocaleString('da')} spillere · M27 (${mCount}) · NFLverse (${nCount})`;
    applyFilters();
  } catch(err) {
    document.getElementById('loading').innerHTML =
      '<p style="color:var(--tr-tx)">Kunne ikke hente data – tjek din forbindelse og genindlæs.</p>';
    console.error(err);
  }
}

/* ── Data fetching ──────────────────────────────────────── */
async function loadSleeper() {
  try {
    const exp = localStorage.getItem(CACHE_EXP);
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw && exp && Date.now() < +exp) return JSON.parse(raw);
  } catch(_){}
  const r = await fetch('https://api.sleeper.app/v1/players/nfl');
  const data = await r.json();
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    localStorage.setItem(CACHE_EXP, (Date.now() + 6*3_600_000).toString());
  } catch(_){}
  return data;
}

async function loadMadden() {
  try {
    const r = await fetch(MADDEN_URL);
    if (!r.ok) return {};
    const data = await r.json();
    return data.players || {};
  } catch(e) {
    console.warn('Madden data ikke tilgængelig:', e);
    return {};
  }
}

async function loadNflverse() {
  try {
    const r = await fetch(NFLVERSE_URL);
    if (!r.ok) return {players:{},teams:{}};
    return await r.json();
  } catch(e) {
    console.warn('NFLverse data ikke tilgængelig:', e);
    return {players:{},teams:{}};
  }
}
function processPlayers(raw) {
  return Object.values(raw)
    .filter(p => {
      if (!p.full_name || !p.position)          return false;
      if (!POSITIONS.includes(p.position))       return false;
      if (p.active === false)                    return false;
      if (p.status === 'Inactive')               return false;
      if (p.position === 'DEF' && !p.team)      return false;
      if (!p.team && (!p.search_rank || p.search_rank > 150)) return false;
      return true;
    })
    .map(p => {
      const _age = calcAge(p);
      const enriched = { ...p, _age };
      return { ...enriched, tags: buildTags(enriched) };
    })
    .sort(mkSort('rank'));
}

/* ── Age ────────────────────────────────────────────────── */
function calcAge(p) {
  if (p.birth_date) {
    const [y,m,d] = p.birth_date.split('-').map(Number);
    const now = new Date();
    let age = now.getFullYear() - y;
    if (now.getMonth()+1 < m || (now.getMonth()+1===m && now.getDate()<d)) age--;
    return age;
  }
  return p.age ?? null;
}

function ageTag(pos, age) {
  if (!age||!pos) return null;
  const prime={QB:[25,34],RB:[22,27],WR:[23,29],TE:[24,30]};
  const concern={QB:35,RB:29,WR:31,TE:32};
  const r=prime[pos]; if(!r) return null;
  if (age>=r[0]&&age<=r[1]) return 'PRIME';
  if (concern[pos]&&age>=concern[pos]) return 'CONCERN';
  return null;
}

/* ── Tag generation ─────────────────────────────────────── */
function buildTags(p) {
  const t=[],yr=p.years_exp,dc=p.depth_chart_order,inj=p.injury_status,sr=p.search_rank;
  const wt=parseInt(p.weight,10)||0, ht=parseInt(p.height,10)||0, pos=p.position;
  const m = maddenData[p.player_id] || {};

  // Rank
  if      (sr&&sr<=12)  t.push({l:'ELITE',  c:'pos'});
  else if (sr&&sr<=50)  t.push({l:'TOP 50', c:'pos'});
  else if (sr&&sr<=100) t.push({l:'TOP 100',c:'pos'});

  // Depth
  if      (dc===1)              t.push({l:'STARTER', c:'pos'});
  else if (dc===2&&pos==='RB')  t.push({l:'HANDCUFF',c:'neu'});
  else if (dc===2)              t.push({l:'BACKUP',  c:'neu'});
  else if (dc>=3)               t.push({l:'DEPTH',   c:'neu'});

  // Experience
  if      (yr===0)  t.push({l:'ROOKIE',  c:'info'});
  else if (yr===1)  t.push({l:'2ND YEAR',c:'info'});
  else if (yr===2)  t.push({l:'3RD YEAR',c:'info'});
  else if (yr>=12)  t.push({l:'LEGEND',  c:'info'});
  else if (yr>=8)   t.push({l:'VETERAN', c:'info'});

  // Age stage
  const stage=ageTag(pos,p._age);
  if (stage==='PRIME')   t.push({l:'PRIME AGE',  c:'pos'});
  if (stage==='CONCERN') t.push({l:'AGE CONCERN',c:'neg'});

  // Physical (only if no Madden data) – kun POWER BACK er rimelig fysisk inferens
  if (!m.speed) {
    if (pos==='RB'&&wt>=220)          t.push({l:'POWER BACK',  c:'info'});
    if (pos==='WR'&&ht>0&&wt>0) {
      if      (ht>=75&&wt>=205) t.push({l:'BIG BODY',  c:'info'});
      else if (ht<=70)          t.push({l:'SLOT BUILD', c:'info'});
    }
    if (pos==='TE'&&ht>=76&&wt>=248) t.push({l:'ELITE SIZE',c:'pos'});
  }

  // ── Madden-based tags ────────────────────────────────────
  if (Object.keys(m).length > 0) {
    if (m.speed >= 92)                                  t.push({l:'SPEED DEMON',   c:'pos'});
    if ((pos==='WR'||pos==='TE') && m.route_short >= 87) t.push({l:'ROUTE TECH',  c:'pos'});
    if ((pos==='WR'||pos==='TE'||pos==='RB') && m.catching >= 87) t.push({l:'SURE HANDS',c:'pos'});
    if (pos==='QB' && m.throw_power >= 92)              t.push({l:'CANNON ARM',   c:'pos'});
    if (pos==='QB' && ((m.throw_acc_short||0)+(m.throw_acc_mid||0)) >= 175)
                                                        t.push({l:'ACCURATE QB',  c:'pos'});
    if (pos==='RB' && ((m.trucking||0)>=85||(m.break_tackle||0)>=85))
                                                        t.push({l:'POWER RUNNER', c:'info'});
    if (pos==='RB' && (m.catching||0)>=72)              t.push({l:'RECEIVING BACK',c:'info'});
    if (pos==='RB' && ((m.juke_move||0)>=88||(m.cod||0)>=88))
                                                        t.push({l:'EVASIVE',      c:'info'});
    if (m.injury != null && m.injury < 75)              t.push({l:'INJURY PRONE', c:'neg'});
    if (m.injury != null && m.injury >= 92)             t.push({l:'DURABLE',      c:'pos'});
  }

  // ── NFLverse 2024 stats tags ─────────────────────────────
  const n = (nflverseData.players||{})[p.player_id] || {};
  if (n.games) {
    if (pos==='RB') {
      if ((n.carry_share||0) >= 0.55)      t.push({l:'WORKHORSE',    c:'pos'});
      else if ((n.carry_share||0) >= 0.40) t.push({l:'LEAD BACK',   c:'info'});
      if ((n.receptions||0) >= 50)         t.push({l:'PASS CATCHER', c:'info'});
    }
    if (pos==='WR'||pos==='TE') {
      if ((n.targets||0) >= 120)           t.push({l:'VOLUME RECV',  c:'pos'});
      if ((n.target_share||0) >= 0.25)     t.push({l:'TARGET HOG',   c:'pos'});
      if ((n.air_yards_share||0) >= 0.20)  t.push({l:'AIR THREAT',   c:'info'});
      if ((n.wopr||0) >= 0.65)             t.push({l:'ELITE WOPR',   c:'pos'});
    }
    if ((n.fpts_per_game||0) >= 18)        t.push({l:'ELITE FLOOR',  c:'pos'});
    else if ((n.fpts_per_game||0) >= 14)   t.push({l:'HIGH FLOOR',   c:'pos'});

    // Trend tags (år-over-år)
    const trend = n.trend;
    if (trend) {
      if      (trend.dir === 'breakout') t.push({l:'BREAKOUT',      c:'pos'});
      else if (trend.dir === 'up')       t.push({l:'TRENDING UP',   c:'pos'});
      else if (trend.dir === 'decline')  t.push({l:'DECLINE RISK',  c:'neg'});
      else if (trend.dir === 'down')     t.push({l:'TRENDING DOWN', c:'neg'});
    }
  }

  // Team/injury
  if (!p.team) t.push({l:'FREE AGENT',c:'neu'});
  const injMap={IR:'IR',Out:'OUT',Doubtful:'DOUBTFUL',Questionable:'QUESTIONABLE',PUP:'PUP',NFI:'NFI'};
  if (inj&&injMap[inj]) t.push({l:injMap[inj],c:'neg'});
  if (p.injury_body_part) {
    const bp=p.injury_body_part.toLowerCase();
    const bpMap=[['knee','KNEE CONCERN'],['hamstring','HAMSTRING'],['ankle','ANKLE CONCERN'],
                 ['shoulder','SHOULDER'],['foot','FOOT CONCERN'],['hip','HIP CONCERN'],['back','BACK CONCERN']];
    for (const [k,lbl] of bpMap) { if(bp.includes(k)){t.push({l:lbl,c:'neg'});break;} }
  }
  const pp=p.practice_participation;
  if      (pp==='DNP')     t.push({l:'DNP',             c:'neg'});
  else if (pp==='Limited') t.push({l:'LIMITED PRACTICE',c:'neg'});

  return t;
}

/* ── Sorting ────────────────────────────────────────────── */
function mkSort(key) {
  return (a,b) => {
    if(key==='name') return (a.full_name||'').localeCompare(b.full_name||'','da');
    if(key==='age')  return (a._age||99)-(b._age||99);
    if(key==='exp')  return (b.years_exp||0)-(a.years_exp||0);
    if(key==='ovr') {
      const ma=maddenData[a.player_id], mb=maddenData[b.player_id];
      return ((mb&&mb.overall)||0)-((ma&&ma.overall)||0);
    }
    return (a.search_rank||9999)-(b.search_rank||9999);
  };
}

/* ── Filter ─────────────────────────────────────────────── */
function applyFilters() {
  const q=document.getElementById('search').value.trim().toLowerCase();
  const base = allPlayers.filter(p => {
    if (activePos!=='ALL'&&p.position!==activePos) return false;
    if (togStarters&&p.depth_chart_order!==1)      return false;
    if (togIR&&(p.injury_status==='IR'||p.injury_status==='Out')) return false;
    if (togFA&&!p.team)                            return false;
    if (q) {
      const hay=[p.full_name,p.team,p.college,p.depth_chart_position].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort(mkSort(sortBy));
  updateTagPills(base);
  filtered = activeTags.size>0
    ? base.filter(p=>{const pts=new Set((p.tags||[]).map(t=>t.l));return [...activeTags].every(tag=>pts.has(tag));})
    : base;
  displayCount=PAGE_SIZE; render();
}

/* ── Tag pills ──────────────────────────────────────────── */
function updateTagPills(base) {
  const counts={};
  base.forEach(p=>(p.tags||[]).forEach(t=>{if(!counts[t.l])counts[t.l]={n:0,c:t.c};counts[t.l].n++;}));
  const entries=Object.entries(counts).sort((a,b)=>{
    const aOn=activeTags.has(a[0])?1:0,bOn=activeTags.has(b[0])?1:0;
    if(aOn!==bOn)return bOn-aOn; return b[1].n-a[1].n;
  }).slice(0,25); // Max 25 tag-pills
  const pRow=document.getElementById('tf-pills');
  pRow.innerHTML=entries.map(([lbl,{n,c}])=>{
    const on=activeTags.has(lbl);
    return `<button class="tf-pill ${c}${on?' on':''}" data-tag="${lbl.replace(/"/g,'&quot;')}">${lbl} <span class="tf-n">${n}</span></button>`;
  }).join('');
  pRow.querySelectorAll('.tf-pill').forEach(btn=>btn.addEventListener('click',()=>{
    const tag=btn.dataset.tag;
    if(activeTags.has(tag))activeTags.delete(tag);else activeTags.add(tag);
    applyFilters();
  }));
  document.getElementById('tf-reset').style.display=activeTags.size?'inline-block':'none';
}

/* ── Render dispatcher ──────────────────────────────────── */
function render() {
  if (teamView === 'teams') { renderTeamGrid(); return; }
  if (teamView)             { renderTeamDetail(teamView); return; }

  const grid=document.getElementById('player-grid');
  const empty=document.getElementById('empty');
  const lmw=document.getElementById('lm-wrap');
  document.getElementById('loading').style.display='none';
  document.getElementById('flt-cnt').textContent=filtered.length.toLocaleString('da')+' spillere';
  if(!filtered.length){grid.style.display='none';empty.style.display='block';lmw.style.display='none';return;}
  empty.style.display='none';
  const slice=filtered.slice(0,displayCount);
  if(listView){
    grid.className='player-list'; grid.style.display='flex';
    grid.innerHTML=slice.map(rowHTML).join('');
  } else {
    grid.className='player-grid'; grid.style.display='grid';
    grid.innerHTML=slice.map(cardHTML).join('');
  }
  lmw.style.display=displayCount<filtered.length?'block':'none';
  grid.querySelectorAll('.player-card,.player-row').forEach((el,i)=>el.addEventListener('click',()=>openDetail(filtered[i])));
}

/* ── Team grid ──────────────────────────────────────────── */
function renderTeamGrid() {
  const grid=document.getElementById('player-grid');
  document.getElementById('loading').style.display='none';
  document.getElementById('empty').style.display='none';
  document.getElementById('lm-wrap').style.display='none';
  document.getElementById('flt-cnt').textContent='32 hold';

  // Group players by team
  const teamStats={};
  allPlayers.filter(p=>p.team).forEach(p=>{
    if(!teamStats[p.team]) teamStats[p.team]={count:0,topOvr:0};
    if(['QB','RB','WR','TE'].includes(p.position)) teamStats[p.team].count++;
    const ovr=(maddenData[p.player_id]||{}).overall||0;
    if(ovr>teamStats[p.team].topOvr) teamStats[p.team].topOvr=ovr;
  });

  const teams=Object.keys(TEAM_NAMES).sort();
  grid.className='team-grid'; grid.style.display='grid';
  grid.innerHTML=teams.map(abbr=>{
    const clr=TEAM_COLORS[abbr]||'#64748B';
    const nm=TEAM_NAMES[abbr]||abbr;
    const city=nm.split(' ').slice(0,-1).join(' ');
    const st=teamStats[abbr]||{count:0,topOvr:0};
    const ovrTxt=st.topOvr?`Top OVR: <strong style="color:${ovrColor(st.topOvr)}">${st.topOvr}</strong>`:'–';
    return `<div class="team-tile" data-team="${abbr}" style="--tc:${clr}">
      <div class="t-color-bar"></div>
      <div class="t-tile-body">
        <div class="t-abbr">${abbr}</div>
        <div class="t-name">${city}</div>
        <div class="t-meta">${ovrTxt}</div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.team-tile').forEach(tile=>
    tile.addEventListener('click',()=>{teamView=tile.dataset.team;render();}));
}

  // NFLverse 2024 stats + karrieregraf

    const d1  = v => v != null ? v.toFixed(1) : '–';

      ['Per kamp',d1(nfl.fpts_per_game),'highlight'],['Kampe',nfl.games,''],
    ];

      ['Targets',int_(nfl.targets),''],['Target Share',pct(nfl.target_share),'highlight'],

      ['Rec TDs',int_(nfl.rec_tds),''],['Yds/Reception',d1(nfl.yards_per_rec),''],
      ['Yds/kamp',d1(nfl.rec_yards_per_game),''],['Rec/kamp',d1(nfl.rec_per_game),''],
      ['Fantasy PPR',d1(nfl.fpts_ppr),''],['Per kamp',d1(nfl.fpts_per_game),'highlight'],
    ];

    // Karrieregraf (sparkline)
    const hist = nfl.hist || {};
    const allYears = [...Object.keys(hist).map(Number).sort(), (nflverseData.season||2024)];
    const allFpts  = allYears.map(y => {
      if (y === (nflverseData.season||2024)) return nfl.fpts_per_game;
      return (hist[String(y)] || {}).fpts_per_game;
    }).filter(v => v != null);

    if (allYears.length >= 2 && allFpts.length >= 2) {

        return `${x},${y}`;
      }).join(' ');
      const trend = nfl.trend;
      const tCol = trend ? (trend.dir==='breakout'||trend.dir==='up'?'#4ADE80':trend.dir==='decline'||trend.dir==='down'?'#F87171':'#7E9BB5') : '#7E9BB5';

      const tLabel = trend ? `${trend.fpts_delta > 0?'+':''}${trend.fpts_delta} pts/kamp${tArrow}` : '';

      sparkHTML = `<div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em">Karriere PPR/kamp</span>
          ${tLabel?`<span style="font-size:11px;font-weight:600;color:${tCol}">${tLabel}</span>`:''}
        </div>
        <svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">
          <polyline points="${pts}" fill="none" stroke="${tCol}" stroke-width="2" stroke-linejoin="round"/>
          ${allFpts.map((v,i)=>{
            const x=pad+(i/(allFpts.length-1))*(W-pad*2);
            const y=H-pad-(v/maxF)*(H-pad*2);
            const yr=allYears[i];
            return `<circle cx="${x}" cy="${y}" r="4" fill="${i===allFpts.length-1?tCol:'var(--surf-3)'}" stroke="${tCol}" stroke-width="1.5"/>
            <text x="${x}" y="${H}" text-anchor="middle" fill="var(--text-3)" font-size="9">${yr}</text>
            <text x="${x}" y="${y-8}" text-anchor="middle" fill="${tCol}" font-size="9" font-weight="600">${v}</text>`;
          }).join('')}
        </svg>
      </div>`;
    }

    nflHTML=`<div class="dp-section">
      <div class="dp-sec-title">Sæson Stats · ${nfl.team} · ${nfl.games} kampe (${nflverseData.season||2024})</div>
      <div class="stats-grid">${rows.map(([k,v,cls])=>`<div class="stat-cell${cls?' '+cls:''}"><div class="stat-val">${v}</div><div class="stat-key">${k}</div></div>`).join('')}</div>
      ${sparkHTML}
    </div>`;
  }

  // Madden section
  const m = maddenData[p.player_id];
  let maddenHTML;
  if (m && m.overall) {
    const attrs = MADDEN_ATTRS[pos] || MADDEN_ATTRS.DEF;
    const bars = attrs.map(({l,k}) => {
      const v = m[k];
      if (v == null) return '';
      const col = v>=90?'#4ADE80':v>=80?'#F97316':v>=70?'#60A5FA':'#F87171';
      return `<div class="mr-row">
        <span class="mr-lbl">${l}</span>
        <div class="mr-bar-bg"><div class="mr-bar" style="width:${v}%;background:${col}"></div></div>
        <span class="mr-val" style="color:${col}">${v}</span>
      </div>`;
    }).join('');
    maddenHTML = `<div class="dp-section">
      <div class="dp-sec-title">Madden 27 Ratings</div>
      <div class="dp-madden-header">
        <div class="dp-ovr-badge" style="background:${clr}">${m.overall}</div>
        <div class="dp-ovr-info">
          <div class="dp-ovr-label">Overall: ${m.overall}</div>
          <div class="dp-ovr-src">Madden NFL 27 · maddenratings.com</div>
        </div>
      </div>
      ${bars}
    </div>`;
  } else {
    maddenHTML = `<div class="dp-section">
      <div class="dp-sec-title">Madden 27 Ratings</div>
      <div class="dp-placeholder">
        <div class="dp-ph-label">Madden-data ikke tilgængelig for denne spiller</div>
      </div>
    </div>`;
  }

  // Draft info
  const me=p.metadata||{};
  const draftHTML=(me.draft_year||me.draft_round)?`<div class="dp-section">
    <div class="dp-sec-title">Draft</div>
    <div class="dp-grid-2">
      ${me.draft_year?`<div class="dp-stat"><div class="dp-stat-val">${me.draft_year}</div><div class="dp-stat-key">Sæson</div></div>`:''}
      ${me.draft_round&&me.draft_slot?`<div class="dp-stat"><div class="dp-stat-val">R${me.draft_round} P${me.draft_slot}</div><div class="dp-stat-key">Placering</div></div>`:''}
    </div></div>`:'';

  // Scheme placeholder
  const schemeHTML=`<div class="dp-section">
    <div class="dp-sec-title">Scheme Tags – Fase 2–3</div>
    <div class="dp-placeholder">
      <div class="dp-ph-label">🔒 Beregnes fra Madden + NFLverse-data</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">
        ${['AIR_RAID_FIT','WEST_COAST_FIT','THREE_DOWN_BACK','SMASHMOUTH_FIT','SLOT_SPECIALIST']
          .map(l=>`<span style="font-size:10px;font-weight:700;letter-spacing:.07em;padding:2px 8px;border-radius:4px;background:var(--surf-3);color:var(--bord-2);text-transform:uppercase">${l}</span>`).join('')}
      </div>
    </div>
  </div>`;

  document.getElementById('dp-body').innerHTML=`
    <div class="dp-hero">
      <div class="dp-photo-outer" style="--c:${clr}">
        <div class="dp-photo-ring">
          <div class="dp-photo-fallback">${initials}</div>
          ${photoUrl?`<img class="dp-photo-img" src="${photoUrl}" alt="" onerror="this.remove()">`:''}
        </div>
      </div>
      <div>
        <div class="dp-name">${e(p.full_name)}</div>
        <div class="dp-team-line">${teamLine}${college}</div>
        ${dcLbl?`<div style="margin-top:6px;font-size:13px;color:var(--text-3)">Depth: <strong style="color:var(--text-2)">${dcLbl}</strong></div>`:''}
      </div>
    </div>
    <div class="dp-section">
      <div class="dp-sec-title">Spillerinfo</div>
      <div class="dp-grid-2">${stats.map(s=>`<div class="dp-stat"><div class="dp-stat-val">${s.v}</div><div class="dp-stat-key">${s.k}</div></div>`).join('')}</div>
      ${p.birth_date?`<div style="font-size:12px;color:var(--text-3);margin-top:10px">Fødselsdato: ${p.birth_date}</div>`:''}
    </div>
    ${injHTML}
    ${draftHTML}
    ${tagsHTML?`<div class="dp-section"><div class="dp-sec-title">Tags</div><div class="dp-tags">${tagsHTML}</div></div>`:''}
    ${nflHTML}
    ${maddenHTML}
    ${schemeHTML}`;

  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

/* ── Helpers ────────────────────────────────────────────── */
function ovrColor(v) {
  if (!v) return 'var(--text-3)';
  if (v >= 90) return '#4ADE80';
  if (v >= 80) return '#F97316';
  if (v >= 70) return '#60A5FA';
  return '#94A3B8';
}
function fmtH(h){if(!h)return'–';const n=parseInt(h,10);if(isNaN(n))return h;return`${Math.floor(n/12)}'${n%12}"`;}
function e(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── Events ─────────────────────────────────────────────── */
document.getElementById('search').addEventListener('input',applyFilters);
document.getElementById('dp-close-btn').addEventListener('click',closeDetail);
document.getElementById('overlay').addEventListener('click',closeDetail);
document.getElementById('tf-reset').addEventListener('click',()=>{activeTags.clear();applyFilters();});

document.getElementById('btn-teams').addEventListener('click',()=>{
  document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-teams').classList.add('active');
  teamView='teams'; render();
});

document.querySelectorAll('.pos-btn').forEach(btn=>btn.addEventListener('click',()=>{
  activePos=btn.dataset.pos;
  document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  teamView=null; activeTags.clear(); applyFilters();
}));
document.getElementById('tog-starters').addEventListener('change',e=>{togStarters=e.target.checked;applyFilters();});
document.getElementById('tog-ir').addEventListener('change',e=>{togIR=e.target.checked;applyFilters();});
document.getElementById('tog-fa').addEventListener('change',e=>{togFA=e.target.checked;applyFilters();});
document.getElementById('sort-by').addEventListener('change',e=>{sortBy=e.target.value;applyFilters();});
document.getElementById('btn-cards').addEventListener('click',()=>{
  listView=false;
  document.getElementById('btn-cards').classList.add('active');
  document.getElementById('btn-list').classList.remove('active');
  render();
});
document.getElementById('btn-list').addEventListener('click',()=>{
  listView=true;
  document.getElementById('btn-list').classList.add('active');
  document.getElementById('btn-cards').classList.remove('active');
  render();
});
document.getElementById('lm-btn').addEventListener('click',()=>{displayCount+=PAGE_SIZE;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});

init();
</script>
</body>
</html>
